[workspace]
resolver = "3"
members = ["crates/hexline-core", "crates/hxng-client", "crates/uniffi-bindgen"]

[workspace.package]
edition = "2021"
license = "GPL-2.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
uniffi = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

# What every phone downloads, so it is built small.
[profile.release]
lto = true
codegen-units = 1
strip = true
