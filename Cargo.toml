[workspace]
resolver = "3"
members = ["crates/hexline-core", "crates/hxng-client", "crates/uniffi-bindgen"]

[workspace.package]
edition = "2021"
license = "GPL-2.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
uniffi = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
# hx-libs at the revision the core needs, which may run ahead of hxd-ng's.
hl-identity = { git = "https://github.com/mishan/hx-libs.git", rev = "fb86aa15df43a0f1b04037d0b106dd2ffc7988c5" }

# Dependencies optimized in debug builds too: the JVM tests load a debug
# core, and a signature checked unoptimized costs them tens of milliseconds.
[profile.dev.package."*"]
opt-level = 2

# What every phone downloads, so it is built small.
[profile.release]
lto = true
codegen-units = 1
strip = true
