[package]
name = "hexline-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hexline's core: the Hotline-ng session, identity and protocol state, exported to the app with uniffi"
publish = false

[lib]
# cdylib for the app (and the JVM tests), lib for the bindgen and Rust tests.
crate-type = ["cdylib", "lib"]

[dependencies]
uniffi = { workspace = true }
