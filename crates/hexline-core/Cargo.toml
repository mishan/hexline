[package]
name = "hexline-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hexline's core: the Hotline-ng session, identity and protocol state, exported to the app with uniffi"
publish = false

[lib]
# cdylib for the app (and the JVM tests), lib for the bindgen and Rust tests.
crate-type = ["cdylib", "lib"]

[features]
# The tests against a real hxd, named by HXD_BIN.
live-tests = ["hxng-client/live-tests"]

[dependencies]
uniffi = { workspace = true, features = ["tokio"] }
hxng-client = { path = "../hxng-client", features = ["tokio"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "macros", "time"] }
serde_json = { workspace = true }
zeroize = { workspace = true }
base64 = "0.23"
getrandom = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The QR code a holder shows an enrollee to scan (enrollment §5.6); MIT or Apache-2.0.
qrcode = { version = "0.14", default-features = false }
hl-identity = { workspace = true }
sha2 = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
# The platform verifier calls Android's trust manager through the JVM, and
# is handed the app's context once, at startup.
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "test-util"] }
proptest = "=1.11.0"
